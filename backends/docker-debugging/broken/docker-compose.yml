services:

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # BUG 2 — hostname is "database" but the service below is named "db".
      # Docker's internal DNS will not resolve "database" — there is no service
      # with that name on the network.
      # Symptom:  app starts then immediately crashes / exits
      # Find it:  docker logs <app_container>  shows OperationalError / name resolution failure
      #           docker exec <app_container> env | grep DATABASE  shows the bad URL
      # Fix:      change "database" to "db"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # BUG 3 — init.sql is mounted to /tmp/init.sql, not to
      # /docker-entrypoint-initdb.d/. The postgres image only auto-runs
      # *.sql files placed in that specific directory on first startup.
      # Symptom:  everything starts cleanly, but GET /items returns []
      #           the items table exists (app doesn't crash) but has no rows
      # Wait — actually the table won't exist at all, so the app WILL crash
      # with "relation 'items' does not exist"
      # Find it:  docker exec <db_container> ls /docker-entrypoint-initdb.d/  → empty
      #           docker inspect <db_container>  → Mounts section shows /tmp/init.sql
      # Fix:      change /tmp/init.sql to /docker-entrypoint-initdb.d/init.sql
      #           then: docker compose down -v && docker compose up  (fresh volume)
      - ./init.sql:/tmp/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

volumes:
  postgres_data:
