services:

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"          # only nginx is exposed to the host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    # No ports: mapping — app is NOT reachable from your host machine directly.
    # It is only reachable from within the Docker network (e.g. by nginx).
    expose:
      - "8000"           # documents the port; does NOT publish it to the host
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
