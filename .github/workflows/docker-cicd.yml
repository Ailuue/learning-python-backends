name: Docker Build & Push

on:
  push:
    branches: [main]
    paths:
      - "backends/docker-cicd/**"
      - ".github/workflows/docker-cicd.yml"
  pull_request:
    paths:
      - "backends/docker-cicd/**"
      - ".github/workflows/docker-cicd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/docker-cicd

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # BuildKit is required for cache-from/cache-to and multi-stage builds.
      # The default Docker on GitHub runners does not have BuildKit enabled.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using the automatically provided GITHUB_TOKEN.
      # Skipped on pull_request events — PRs from forks can't write packages.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates tags and OCI labels from git metadata.
      # On main: produces "latest" + "sha-<short-commit>" tags.
      # On a branch: produces "sha-<short-commit>" only (no latest).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Build the image, using GitHub Actions cache for layer caching.
      # type=gha     → stores BuildKit layers in GitHub's cache (5 GB free per repo)
      # mode=max     → cache ALL layers, including intermediate builder stages
      # push: false on PRs (build only); push: true on main (build + push)
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backends/docker-cicd
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the image digest — the immutable sha256 fingerprint of this exact image.
      # Reference this digest (not a tag) in your deploy step so you know exactly
      # what version is running. Tags are mutable; digests are not.
      - name: Image digest
        run: echo "Pushed ${{ steps.meta.outputs.tags }} → digest ${{ steps.build-push.outputs.digest }}"
